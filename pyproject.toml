[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sqlc-bin"
# Tracks the sqlc release version. Use a ".postN" suffix for packaging-only fixes.
version = "1.31.1"
description = "The official sqlc binaries, pip-installable — no Go toolchain required"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Christopher" }]
keywords = ["sqlc", "sql", "codegen", "database", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Repository = "https://github.com/rayakame/sqlc-bin"
"sqlc upstream" = "https://github.com/sqlc-dev/sqlc"
"sqlc documentation" = "https://docs.sqlc.dev"

[project.scripts]
sqlc = "sqlc_bin:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlc_bin"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/hatch_build.py", "/checksums.json"]
