name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version v$version" >&2
            exit 1
          fi
      - name: Build sdist
        run: uv build --sdist
      - name: Build a wheel per platform
        run: |
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            SQLC_BIN_TARGET="$target" uv build --wheel
          done
          ls -l dist/
      - name: Verify the sdist builds a working wheel
        run: |
          uv venv
          uv pip install dist/sqlc_bin-*.tar.gz
          uv run --no-project sqlc version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux amd64
          - ubuntu-24.04-arm   # linux arm64
          - macos-15-intel     # darwin amd64
          - macos-latest       # darwin arm64
          - windows-latest     # windows amd64
          - windows-11-arm     # windows arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install the platform wheel and test it
        shell: bash
        run: |
          uv venv
          uv pip install --no-index --find-links dist sqlc-bin
          uv pip install pytest
          uv run --no-project sqlc version
          uv run --no-project pytest -v

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sqlc-bin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Publish to PyPI (trusted publishing)
        run: uv publish

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sqlc_version="${version%%.post*}"
          cat > notes.md <<'EOF'
          Ships sqlc **vSQLC_VERSION** ([upstream release notes](https://github.com/sqlc-dev/sqlc/releases/tag/vSQLC_VERSION)), repackaged unmodified into platform-tagged wheels and verified against pinned sha256 checksums.

          ## Install

          ```sh
          uv tool install sqlc-bin   # or: uv add --dev sqlc-bin
          pip install sqlc-bin
          ```

          ## Platforms

          Linux (glibc + musl), macOS 11+, and Windows — x86_64 and arm64 each.

          📦 [sqlc-bin PKG_VERSION on PyPI](https://pypi.org/project/sqlc-bin/PKG_VERSION/)
          EOF
          sed -i "s/SQLC_VERSION/${sqlc_version}/g; s/PKG_VERSION/${version}/g" notes.md
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
