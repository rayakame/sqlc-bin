name: Check for new sqlc release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Update version and checksums
        run: uv run --no-project scripts/bump_sqlc.py
      - name: Refresh uv.lock
        run: |
          if ! git diff --quiet pyproject.toml; then
            uv lock
          fi
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Bump sqlc to the latest release
          title: Bump sqlc to the latest release
          body: >
            Automated bump created by `.github/workflows/bump.yml` using
            `scripts/bump_sqlc.py`. Review the checksum changes, merge, then
            tag `v<version>` to publish.
          branch: bump-sqlc
          delete-branch: true
